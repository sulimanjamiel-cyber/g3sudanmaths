/* Layout: same family as "رياضيات الصف الثالث" — home of 3 unit cards, a lesson map per unit, then one activity card at a time */
:root{
  --paper:#EEF6FF; --card:#FFFFFF; --ink:#1A2233; --muted:#55607A; --line:#D3DDEB;
  --c1:#F0505A; --c2:#2F80ED; --c3:#1E9E57; --c4:#8E44D9; --c5:#F2711C; --c6:#E0428C; --c7:#0E9AA7; --c8:#4B5BD6;
  --gc:#1E9E57; --blob1:rgba(255,196,0,.30); --blob2:rgba(30,158,87,.18); --blob3:rgba(47,128,237,.16);
  --yellow:#F2B705; --yellow-soft:#FCEFC2; --yellow-ink:#3A2C00;
  --blue:#2F80ED; --ok:#1D7F62; --ok-soft:#DCF1E7; --bad:#C2423A; --bad-soft:#FBE4E0;
  --wire:#2A3550; --sky:#DCEBFF; --soil:#8A5A33; --leaf:#2E9E4F; --dry:#B08A3E; --wall:#E9DCC4; --dark:#26314A;
  --f-display:"Two Sudan","Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --f-body:"Two Sudan","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141F; --card:#1A2030; --ink:#EEF2FA; --muted:#A1ABC2; --line:#323C52;
  --c1:#F25F67; --c2:#4A8FEF; --c3:#2AAE66; --c4:#A266E6; --c5:#F47F2F; --c6:#E5559A; --c7:#1AAAB6; --c8:#6474EA;
  --gc:#2AAE66; --blob1:rgba(255,196,0,.10); --blob2:rgba(42,174,102,.14); --blob3:rgba(47,128,237,.12);
  --yellow:#F5C434; --yellow-soft:#3A3115; --yellow-ink:#3A2C00;
  --blue:#4A8FEF; --ok:#45C99D; --ok-soft:#14352A; --bad:#F27D70; --bad-soft:#3D1F1C;
  --wire:#C9D3EA; --sky:#1C2A44; --soil:#7A5030; --leaf:#3DBA62; --dry:#A2803A; --wall:#3A3428; --dark:#05070C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141F; --card:#1A2030; --ink:#EEF2FA; --muted:#A1ABC2; --line:#323C52;
  --c1:#F25F67; --c2:#4A8FEF; --c3:#2AAE66; --c4:#A266E6; --c5:#F47F2F; --c6:#E5559A; --c7:#1AAAB6; --c8:#6474EA;
  --gc:#2AAE66; --blob1:rgba(255,196,0,.10); --blob2:rgba(42,174,102,.14); --blob3:rgba(47,128,237,.12);
  --yellow:#F5C434; --yellow-soft:#3A3115; --yellow-ink:#3A2C00;
  --blue:#4A8FEF; --ok:#45C99D; --ok-soft:#14352A; --bad:#F27D70; --bad-soft:#3D1F1C;
  --wire:#C9D3EA; --sky:#1C2A44; --soil:#7A5030; --leaf:#3DBA62; --dry:#A2803A; --wall:#3A3428; --dark:#05070C; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(520px 380px at 0% 0%,var(--blob1),transparent 70%),radial-gradient(520px 420px at 100% 20%,var(--blob2),transparent 70%),radial-gradient(600px 420px at 40% 100%,var(--blob3),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg text{font-family:var(--f-display)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.tab{display:inline-block;background:var(--gc);color:#fff;font-family:var(--f-display);font-weight:700;border-radius:6px;padding:1px 10px 0;font-size:15px;align-self:flex-start}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,50px);line-height:1.1;margin:6px 0 0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 64%, var(--yellow) 64%, var(--yellow) 90%, transparent 90%)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px}
.sub{color:var(--muted);margin:0}

/* home */
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.units{grid-template-columns:1fr}}
.unit{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--tc);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:right;transition:transform .15s,border-color .15s;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.05)}
@media (max-width:720px){.unit{flex-direction:row;align-items:center}}
.unit:hover{transform:translateY(-2px);border-color:var(--tc)}
.uicon{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--tc) 16%,var(--card));flex:none}
.unit .ubody{display:flex;flex-direction:column;gap:4px;min-width:0}
.unit .tab{background:var(--tc)}
.unit .nm{font-family:var(--f-display);font-weight:800;color:var(--tc);font-size:28px;line-height:1.2}
.unit .pg{color:var(--muted);font-size:14px}
.unit .topics{font-size:14px;color:var(--ink)}

/* map */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--card)}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lesson{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--tc);border-radius:16px;padding:12px 12px 10px;text-align:right;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.05)}
.lesson:hover{transform:translateY(-2px);border-color:var(--tc)}
.lesson .ln{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lesson .tab{font-size:13px;background:var(--tc)}
.lesson .mi{font-size:30px;line-height:1}
.lesson .pg{color:var(--muted);font-size:13px}
.lesson .nm{font-family:var(--f-display);font-weight:700;color:var(--tc);font-size:20px;line-height:1.25}
.stars{letter-spacing:2px;font-size:18px;color:var(--line)}
.stars .on{color:#F5B400}
.lesson.final{grid-column:1/-1;background:var(--gc);border-color:var(--gc);color:#fff}
.lesson.final .nm{color:#fff;font-size:22px}
.lesson.final .pg{color:#F0FFF6}
.lesson.final .tab{background:var(--yellow);color:var(--yellow-ink)}
.lesson.final .stars{color:rgba(255,255,255,.35)}
.lesson.final .stars .on{color:#FFD43B}

/* play */
.prog{flex:1;min-width:80px;height:12px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--gc) 0 12px,var(--yellow) 12px 24px);border-radius:99px;transition:width .3s}
.count{font-weight:600;min-width:52px;text-align:center}
.streak{font-weight:700;color:#E8590C;background:color-mix(in srgb,#FF8A3D 18%,var(--card));border-radius:999px;padding:2px 10px;white-space:nowrap}
.card{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--gc);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 rgba(0,0,0,.05)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.qtype{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.say{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;font-size:14px}
.q{font-size:21px;font-weight:600;margin:0;line-height:1.7}
.vis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}
.card.fx-ok{animation:bounce .45s}
.card.fx-no{animation:shake .35s}
@keyframes bounce{40%{transform:scale(1.02)}70%{transform:scale(.995)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* item chip: emoji/picture + word */
.it{display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.it .e{font-size:38px;line-height:1.15;display:grid;place-items:center;min-height:44px}
.it .e svg{width:44px;height:44px}
.it .w{font-weight:600;font-size:16px;text-align:center}
.it.row{flex-direction:row;gap:8px}
.it.row .e{font-size:28px;min-height:0}
.it.row .e svg{width:32px;height:32px}
.it.row .w{font-size:18px}

/* mcq */
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;text-align:right;min-height:62px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--gc)}
.opt .L{font-family:var(--f-display);font-weight:800;font-size:20px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.opt:nth-child(4n+1) .L{background:var(--c1)}.opt:nth-child(4n+2) .L{background:var(--c2)}.opt:nth-child(4n+3) .L{background:var(--c5)}.opt:nth-child(4n+4) .L{background:var(--c4)}
.opt .C{flex:1;font-size:19px;font-weight:600;min-width:0;display:flex;justify-content:flex-start;align-items:center}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt .C svg{max-width:100%;height:auto}

/* true / false */
.tfbox{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tfb{min-width:150px;padding:14px 22px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);font-family:var(--f-display);font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;justify-content:center}
.tfb .m{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px}
.tfb.t .m{background:var(--c3)} .tfb.f .m{background:var(--c1)}
.tfb:hover:not(:disabled){border-color:var(--gc)}
.tfb.right{border-color:var(--ok);background:var(--ok-soft)}
.tfb.wrong{border-color:var(--bad);background:var(--bad-soft)}
.statement{background:color-mix(in srgb,var(--yellow) 22%,var(--card));border-radius:14px;padding:14px 18px;font-size:22px;font-weight:700;text-align:center;font-family:var(--f-display)}

/* selects */
.sent{font-size:21px;line-height:2.4;font-weight:600}
select.dd{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--yellow) 35%,var(--card));
  border:2px solid var(--line);border-radius:10px;padding:0 6px;min-width:110px;height:44px;margin:0 4px;max-width:100%}
select.dd.right{border-color:var(--ok);background:var(--ok-soft)}
select.dd.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cmap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;font-weight:600}
.cmap .node{background:color-mix(in srgb,var(--gc) 14%,var(--card));border-radius:12px;padding:4px 10px;text-align:center}
.cmap .arr{color:var(--muted);font-size:15px}
.cmap .rowx{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ftable{border-collapse:collapse;margin:0 auto;font-size:18px}
.ftable td,.ftable th{border:1.5px solid var(--line);padding:6px 10px;text-align:center}
.ftable th{background:color-mix(in srgb,var(--yellow) 40%,var(--card))}
.tblwrap{overflow-x:auto}

/* chips, bins */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;border:2px dashed var(--line);border-radius:16px;padding:12px;min-height:90px}
.chip{min-width:84px;min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:6px 8px;touch-action:none}
.chip.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card));transform:translateY(-3px)}
.chip.right{border-color:var(--ok);background:var(--ok-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chip.done{opacity:.35;pointer-events:none}
.chip.lifting{opacity:.35}
.dragghost{position:fixed;z-index:60;pointer-events:none;margin:0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.bins{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px}
@media (max-width:560px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{border:2.5px dashed var(--bc,var(--line));border-radius:16px;min-height:110px;padding:8px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--bc,var(--gc)) 8%,var(--card));cursor:pointer;min-width:0}
.bin.nope{border-color:var(--bad);background:var(--bad-soft)}
.bin.hot{border-style:solid}
.binl{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--bc,var(--gc));text-align:center;line-height:1.3}
.bini{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bini .it .e{font-size:26px;min-height:30px}
.bini .it .e svg{width:30px;height:30px}
.bini .it .w{font-size:13px}
.bini .placed{background:var(--card);border-radius:10px;padding:3px 5px;animation:popin .25s}
@keyframes popin{0%{transform:scale(.4)}70%{transform:scale(1.1)}}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;max-width:520px;margin:0 auto;width:100%}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .chip{width:100%;min-height:70px}
.match .chip .word{font-family:var(--f-display);font-weight:700;font-size:20px}

/* order */
.slots{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.slot{min-width:84px;min-height:84px;border:2.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;position:relative;padding:6px}
.slot .n{position:absolute;top:-10px;right:-8px;background:var(--gc);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:15px;font-family:var(--f-display);font-weight:800}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slots .arrow{font-family:var(--f-display);font-size:26px;color:var(--muted)}
.dirnote{text-align:center;color:var(--muted);font-weight:600}
.letters .chip,.letters .slot{min-width:56px;min-height:60px}
.letters .chip .word,.letters .slot .word{font-family:var(--f-display);font-size:30px;font-weight:800}

/* balloons */
.pond{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center;padding:14px 6px 24px;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 14%,var(--card)),var(--card))}
.balloon{position:relative;border:none;background:none;padding:0;width:96px;height:124px;animation:float 3.2s ease-in-out infinite;animation-delay:var(--d)}
.balloon .bl{position:absolute;inset:0 0 22px 0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65),transparent 36%),var(--c);display:grid;place-items:center;box-shadow:inset -6px -8px 0 rgba(0,0,0,.10)}
.balloon .bl .it .e{font-size:32px;min-height:36px}
.balloon .bl .it .e svg{width:34px;height:34px}
.balloon .bl .it .w{font-size:13px;color:#1A2233;background:rgba(255,255,255,.8);border-radius:8px;padding:0 5px}
.balloon .str{position:absolute;left:50%;bottom:0;width:2px;height:24px;background:var(--muted)}
.balloon.popped{animation:burst .35s forwards;pointer-events:none}
.balloon.shake{animation:shake .35s}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes burst{60%{transform:scale(1.25);opacity:.7}100%{transform:scale(0);opacity:0}}

/* svg scenes */
svg.scene{max-width:100%;height:auto;display:block;margin:0 auto}
svg .hit{cursor:pointer}
svg .hit:hover{filter:brightness(1.08)}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.sbtn{min-width:48px;height:48px;border-radius:999px;border:2px solid var(--gc);background:var(--card);color:var(--gc);font-family:var(--f-display);font-size:20px;font-weight:800;padding:0 14px}
.sbtn:active{transform:scale(.95)}
.sbtn:disabled{opacity:.4}
.mover{display:flex;flex-direction:column;align-items:center;gap:4px;background:color-mix(in srgb,var(--gc) 10%,var(--card));border-radius:14px;padding:6px 8px}
.mover .sbtn{min-width:44px;height:40px;font-size:18px;padding:0 10px}
.mover b{font-size:14px;color:var(--muted)}
.status{text-align:center;font-weight:700;font-size:18px}
.matrow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;max-width:460px;margin:0 auto;width:100%}
.matbtn{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 12px;font-weight:700;text-align:right}
.matbtn.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}

/* letter grid */
.lgrid{display:grid;grid-template-columns:repeat(5,58px);gap:6px;justify-content:center}
.lc{height:58px;border-radius:12px;border:2px solid var(--line);font-family:var(--f-display);font-size:30px;font-weight:800;display:grid;place-items:center;background:var(--bg,var(--card))}
.lc.x{opacity:.25;text-decoration:line-through;pointer-events:none}
.lc.keep{border-color:var(--ok);background:var(--ok-soft)}
.phrase{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-family:var(--f-display);font-size:24px;font-weight:800}
.phrase span{min-width:30px;text-align:center;border-bottom:3px solid var(--line);padding:0 2px}
.phrase span.got{color:var(--ok);border-color:var(--ok)}
.phrase span.sp{border:none;min-width:12px}

/* feedback */
.fb{border-radius:14px;padding:12px 16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .tip{color:var(--ink);font-weight:500;display:block}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--gc);color:#fff;border:none;border-radius:999px;padding:10px 30px;font-weight:700;font-size:19px;font-family:var(--f-display)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--card);color:var(--gc);border:2px solid var(--gc)}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--f-display);font-size:64px;font-weight:800;color:var(--gc);line-height:1}
.result .stars{font-size:44px}
.result h2{font-family:var(--f-display);font-size:30px;margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* credit */
.credit[hidden]{display:none!important}
.credit{margin-top:8px;border-top:1.5px dashed var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;color:var(--muted);font-size:15px;text-align:center}
.credit b{color:var(--gc);font-family:var(--f-display);font-size:18px}
.credit .phone{font-family:var(--f-display);font-weight:700;color:var(--ink);user-select:all;letter-spacing:.03em}

@media (max-width:480px){
  body{font-size:16px} .card{padding:16px} .q{font-size:19px} .sent{font-size:19px}
  .chip{min-width:74px;min-height:76px} .it .e{font-size:32px}
  .lgrid{grid-template-columns:repeat(5,50px)} .lc{height:50px;font-size:26px}
  .balloon{width:84px;height:112px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

      const t=actx.currentTime+i*0.11;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.22);});
  }catch(e){} }
function pop(){ if(!soundOn) return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.setValueAtTime(700,actx.currentTime);o.frequency.exponentialRampToValueAtTime(120,actx.currentTime+0.12);g.gain.setValueAtTime(0.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.14);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.15);}catch(e){} }

$("#soundBtn").addEventListener("click",()=>{soundOn=!soundOn;store.set("sci3-sound",soundOn);paintSound();});

/* ---------- small pictures (drawn where no emoji exists) ---------- */

function plantSvg(health,x,label,wet){
  // health 0..7 : 7 = fresh, 0 = wilted

  const leaf=(cx,cy,ang)=>`<ellipse cx="${cx}" cy="${cy}" rx="18" ry="8" fill="${stemCol}" transform="rotate(${ang} ${cx} ${cy})"/>`;
  return `<g transform="translate(${x},0)">

  const total=Object.values(need).reduce((a,b)=>a+b,0); let gone=0;
  const pcs=[...phrase].map(c=>c===" "?`<span class="sp"></span>`:`<span data-c="${c==="ه"?"هـ":c}">${c}</span>`).join("");
  const bgs=["#D6ECFB","#fff","#FFF6CC","#fff","#FDE0EC","#fff","#FDE0EC","#fff","#ECECEC","#fff","#FFE3D6","#fff","#DCF0E2","#fff","#FFF6CC","#fff","#E3E0F3","#fff","#D6ECFB","#fff","#FDE0EC","#DCF0E2"];
  body.insertAdjacentHTML("beforeend",`<div class="phrase" aria-label="العبارة">${pcs}</div>
    <div class="lgrid">${G.map((c,i)=>`<button class="lc" data-c="${c}" style="--bg:color-mix(in srgb,${bgs[i]} 70%,var(--card))">${c}</button>`).join("")}</div>
    <div class="dirnote" id="gnote">اضغط على كل حرف من حروف العبارة لتحذفه. حُذف <span id="gone">0</span> من ${total}.</div><div id="stage2"></div>`);
  body.querySelectorAll(".lc").forEach(b=>b.addEventListener("click",()=>{ const c=b.dataset.c;
    if(need[c]>0){ need[c]--; gone++; b.classList.add("x"); pop(); $("#gone").textContent=gone;
      const sp=body.querySelector(`.phrase span[data-c="${c}"]:not(.got)`); if(sp) sp.classList.add("got");
      if(gone===total){ body.querySelectorAll(".lc:not(.x)").forEach(x=>{x.classList.add("keep");x.disabled=true;});
        soft("ممتاز! حذفت كل حروف العبارة. الآن رتّب الحروف الباقية لتكوّن اسم المجموعة.");
        const st=$("#stage2"); const word=["ا","ل","ث","د","ي","ي","ا","ت"];
        R.order({items:word.map(c=>W(c)),letters:true,dir:"اكتب الكلمة من اليمين إلى اليسار ←"},st,()=>{
          st.insertAdjacentHTML("beforeend",`<div class="statement" style="margin-top:12px">الثدييات تلد وترضع صغارها.</div>`); correct(q,"الكلمة هي: الثدييات."); }); } }
    else { shakeEl(b); wrong("هذا الحرف ليس من حروف العبارة الباقية."); } }));
 },
 plant(q,body){
  let day=0; const hA=()=>7, hB=()=>Math.max(0,7-day);
  const draw=()=>{ $("#pv").innerHTML=`<svg class="scene" viewBox="0 0 300 250" width="320" role="img" aria-label="نباتان في أصيصين">${plantSvg(hA(),170,"أ",day>0)}${plantSvg(hB(),40,"ب",false)}${day>0?`<text x="220" y="16" text-anchor="middle" font-size="22">💧</text>`:""}</svg>`;
    $("#dayl").textContent=`اليوم: ${day} من 7`; bind(); };
  body.insertAdjacentHTML("beforeend",`<div class="vis" id="pv"></div><div class="status" id="dayl"></div><div class="ctrls"><button class="sbtn" id="dayBtn">☀️ يوم جديد واسقِ النبات (أ)</button></div><div class="status" id="ask" hidden>مرّ أسبوع! اضغط على النبات الذي ذبل.</div>`);
  let asking=false;
  const bind=()=>{ if(!asking) return; $("#pv").querySelectorAll("svg > g").forEach((g,i)=>{ g.classList.add("hit"); g.addEventListener("click",()=>{ if(!asking) return;
    if(i===1){ asking=false; correct(q,"النبات الذي لم نسقه ذبل، فالماء ضروري لحياة الكائن الحي."); } else wrong("انظر إلى الأوراق: أيهما تغيّر لونها وانحنت؟"); }); }); };
  $("#dayBtn").addEventListener("click",()=>{ if(day<7){ day++; pop(); draw(); } if(day===7){ $("#dayBtn").disabled=true; $("#ask").hidden=false; asking=true; bind(); } });

 },
 align(q,body){
  const pos=[0,0,0].map(()=>[-2,-1,1,2][Math.floor(Math.random()*4)]); const step=16;
  const draw=()=>{ const ok=pos.every(p=>p===0); const xs=[110,165,220];
    $("#av").innerHTML=`<svg class="scene" viewBox="0 0 330 170" width="340" role="img" aria-label="شمعة وثلاثة حوائل">
      <rect x="0" y="0" width="330" height="170" rx="12" fill="var(--sky)"/>
      ${ok?`<line x1="40" y1="70" x2="300" y2="70" stroke="#FFD43B" stroke-width="6" opacity=".9"/>`:""}
      <rect x="30" y="80" width="20" height="60" rx="3" fill="#F7F1E3" stroke="#B8A27A" stroke-width="1.5"/><path d="M40 52 Q30 66 40 76 Q50 66 40 52 Z" fill="#FF9F1C"/><circle cx="40" cy="70" r="16" fill="#FFD43B" opacity=".35"/>
      ${xs.map((x,i)=>{const hy=70+pos[i]*step;return `<rect x="${x-7}" y="18" width="14" height="140" fill="#7FB2E8" stroke="#2F5E96" stroke-width="2"/><rect x="${x-7}" y="${hy-5}" width="14" height="10" fill="var(--dark)"/>`;}).join("")}
      <g transform="translate(296,70)"><ellipse rx="20" ry="12" fill="#fff" stroke="#3B2A1C" stroke-width="2"/><circle r="6" fill="#3B2A1C"/></g>
      <text x="300" y="104" text-anchor="middle" font-size="14" fill="var(--muted)" font-weight="700">عينك</text>
    </svg>`;
    $("#astat").textContent=ok?"ترى ضوء الشمعة الآن!":"لا ترى ضوء الشمعة بعد.";
    return ok; };
  body.insertAdjacentHTML("beforeend",`<div class="vis" id="av"></div><div class="status" id="astat"></div>
    <div class="ctrls">${[2,1,0].map(i=>`<div class="mover"><button class="sbtn" data-i="${i}" data-d="-1" aria-label="ارفع الحائل ${i+1}">▲</button><b>الحائل ${i+1}</b><button class="sbtn" data-i="${i}" data-d="1" aria-label="اخفض الحائل ${i+1}">▼</button></div>`).join("")}</div>`);
  let done=false; draw();
  body.querySelectorAll(".mover .sbtn").forEach(b=>b.addEventListener("click",()=>{ if(done) return; const i=+b.dataset.i; pos[i]=Math.max(-3,Math.min(3,pos[i]+ +b.dataset.d));
    if(draw()){ done=true; body.querySelectorAll(".mover .sbtn").forEach(x=>x.disabled=true); correct(q,"يُرى الضوء عندما تكون الثقوب على استقامة واحدة."); } }));
 },
 shadow(q,body){
  const XS=[235,195,155,115,75]; let k=2; const TX=300, WX=24, H=34;
  const draw=()=>{ const x=XS[k], d=TX-x, sh=Math.min(176,H*(TX-WX)/d), cy=100;
    $("#sv").innerHTML=`<svg class="scene" viewBox="0 0 330 200" width="340" role="img" aria-label="مصباح يدوي وكتاب وحائط">
      <rect x="0" y="0" width="330" height="200" rx="12" fill="var(--dark)"/>
      <rect x="6" y="8" width="${WX-6}" height="184" fill="var(--wall)"/>
      <polygon points="${TX-8},${cy-12} ${WX},4 ${WX},196 ${TX-8},${cy+12}" fill="#FFE066" opacity=".5"/>
      <rect x="6" y="${cy-sh/2}" width="${WX-4}" height="${sh}" fill="#141414" opacity=".85"/>
      <rect x="${x-6}" y="${cy-H/2}" width="12" height="${H}" fill="#9C4A2E" stroke="#5A2A18" stroke-width="2"/>
      <g transform="translate(${TX},${cy})"><rect x="-6" y="-12" width="12" height="24" rx="3" fill="#C9CED6"/><rect x="6" y="-8" width="24" height="16" rx="4" fill="#F2B705" stroke="#9C7A00" stroke-width="1.5"/></g>
      <text x="${x}" y="${cy+H/2+18}" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">كتاب</text>
      <text x="62" y="190" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">الحائط</text>
    </svg>`; $("#left1").disabled=k===XS.length-1; $("#right1").disabled=k===0; };
  body.insertAdjacentHTML("beforeend",`<div class="vis" id="sv"></div><div class="ctrls"><button class="sbtn" id="right1">نحو المصباح ▶</button><button class="sbtn" id="left1">◀ نحو الحائط</button></div>`);
  draw();
  $("#left1").addEventListener("click",()=>{ if(k<XS.length-1){k++;draw();} }); $("#right1").addEventListener("click",()=>{ if(k>0){k--;draw();} });
  checkBtn(()=>{ const good=q.goal==="big"?k===0:k===XS.length-1;
    if(good){ body.querySelectorAll(".ctrls .sbtn").forEach(b=>b.disabled=true); correct(q,q.goal==="big"?"كلما اقترب الجسم من المصباح كبر ظله.":"كلما ابتعد الجسم عن المصباح واقترب من الحائط صغر ظله."); }
    else wrong("حرّك الكتاب أكثر ولاحظ تغيّر الظل."); });
 },
 see(q,body){
  const M=[{n:"لوح زجاجي",ic:"glass",a:0,ov:`<div style="position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(190,225,255,.15));border:3px solid #6BA6D6"></div>`},
           {n:"قطعة شاش",ic:"gauze",a:1,ov:`<div style="position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.75) 0 3px,rgba(255,255,255,.45) 3px 6px),repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)"></div>`},
           {n:"ورق كرتون مقوى",ic:"cardboard",a:2,ov:`<div style="position:absolute;inset:0;border-radius:12px;background:#C99A62;border:3px solid #7A5530"></div>`}];
  const K=["مادة شفافة","مادة نصف شفافة","مادة معتمة"];
  body.insertAdjacentHTML("beforeend",`<div class="vis"><div id="pic" style="position:relative;width:200px;height:150px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:96px;overflow:hidden">🦒<div id="ovl"></div></div></div>
    <div class="matrow">${M.map((m,i)=>`<button class="matbtn" data-m="${i}">${IT(m.ic,m.n,"row")}</button><select class="dd" data-i="${i}" aria-label="نوع ${m.n}"><option value="">اختر…</option>${shuffle([0,1,2]).map(j=>`<option value="${j}">${K[j]}</option>`).join("")}</select>`).join("")}</div>
    <div class="dirnote" style="font-weight:400">اضغط على اسم المادة لتضعها فوق الصورة.</div>`);
  body.querySelectorAll(".matbtn").forEach(b=>b.addEventListener("click",()=>{ const on=b.classList.contains("on"); body.querySelectorAll(".matbtn").forEach(x=>x.classList.remove("on"));
    $("#ovl").innerHTML=on?"":M[+b.dataset.m].ov; if(!on) b.classList.add("on"); }));
  const sels=[...body.querySelectorAll("select.dd")];
  const btn=checkBtn(()=>{ let ok=true; sels.forEach(s=>{const g=+s.value===M[+s.dataset.i].a; s.classList.toggle("right",g); s.classList.toggle("wrong",!g); if(!g) ok=false;});
    if(ok){ sels.forEach(s=>s.disabled=true); correct(q); } else wrong("جرّب المادة فوق الصورة مرة أخرى ولاحظ."); },false);
  sels.forEach(s=>s.addEventListener("change",()=>{ s.classList.remove("right","wrong"); btn.disabled=sels.some(x=>x.value===""); }));
 },
 dynamo(q,body){
  let e=0, ang=0, done=false, raf=null;
  body.insertAdjacentHTML("beforeend",`<div class="vis"><svg class="scene" viewBox="0 0 320 200" width="330" role="img" aria-label="عجلة دراجة ودينمو ومصباح">
     <g id="wheel" transform="translate(110,110)"><circle r="78" fill="none" stroke="#2B2B2B" stroke-width="10"/><circle r="70" fill="none" stroke="#9AA3AD" stroke-width="3"/>
       ${Array.from({length:12},(_,i)=>`<line x1="0" y1="0" x2="${(70*Math.cos(i*Math.PI/6)).toFixed(1)}" y2="${(70*Math.sin(i*Math.PI/6)).toFixed(1)}" stroke="#9AA3AD" stroke-width="2"/>`).join("")}<circle r="8" fill="#5B6573"/></g>
     <g transform="translate(200,40)"><rect x="-12" y="0" width="24" height="44" rx="9" fill="#C9CED6" stroke="#555" stroke-width="2"/><circle id="dcap" cx="0" cy="48" r="7" fill="#555"/><text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">الدينمو</text></g>
     <path d="M212 50 Q250 40 262 70" fill="none" stroke="var(--wire)" stroke-width="3"/>
     <g transform="translate(270,100)"><circle id="glow" r="34" fill="#FFE066" opacity="0"/><circle id="bulb" r="18" fill="#E6EAF0" stroke="#5B6573" stroke-width="2.5"/><rect x="-9" y="-36" width="18" height="18" rx="3" fill="#5B6573"/><text x="0" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">المصباح</text></g>
   </svg></div><div class="status" id="dstat">المصباح لا يضيء</div><div class="ctrls"><button class="sbtn" id="spin">🔄 أدِر العجلة</button></div>`);
  const tick=()=>{ if(!document.body.contains($("#wheel"))) return; e=Math.max(0,e-0.006); ang+=e*22; $("#wheel").setAttribute("transform",`translate(110,110) rotate(${ang})`);
    const b=Math.min(1,e); $("#glow").setAttribute("opacity",(b*.6).toFixed(2)); $("#bulb").setAttribute("fill",b>.15?`color-mix(in srgb,#FFD43B ${Math.round(b*100)}%,#E6EAF0)`:"#E6EAF0");
    $("#dstat").textContent=b>=.85?"المصباح يضيء!":b>.15?"المصباح يضيء قليلاً… أسرع!":"المصباح لا يضيء";
    if(b>=.85&&!done){ done=true; correct(q,"الدينمو يعطينا كهرباء عندما تدور العجلة."); }
    raf=requestAnimationFrame(tick); };
  $("#spin").addEventListener("click",()=>{ e=Math.min(1.3,e+0.16); });
  tick();
 },
 circuit(q,body){
  let closed=false;
  const draw=()=>{ $("#cv").innerHTML=circuitSvg({closed,sw:!closed}); if(!closed) $("#sw").addEventListener("click",()=>{ closed=true; pop(); draw(); $("#cs").textContent="الدائرة مغلقة: المصباح يضيء"; correct(q,"الكهرباء تسري في الدائرة المغلقة."); }); };
  body.insertAdjacentHTML("beforeend",`<div class="vis" id="cv"></div><div class="status" id="cs">الدائرة مفتوحة: المصباح لا يضيء</div>`);
  draw();
 },
 build(q,body){
  const parts={lamp:!q.missing.includes("lamp"),battery:!q.missing.includes("battery"),wire:!q.missing.includes("wire")};
  const NAMES={battery:IT("battery","بطارية"),lamp:IT("💡","مصباح"),wire:IT("〰️","سلك")};
  let sel=null, closed=false;
  const tray=shuffle(["battery","lamp","wire"]);
  body.insertAdjacentHTML("beforeend",`<div class="vis" id="cv"></div><div class="status" id="cs"></div><div class="pool" id="tray">${tray.map(p=>`<button class="chip" data-p="${p}">${NAMES[p]}</button>`).join("")}</div><div class="dirnote" style="font-weight:400">اضغط على القطعة ثم على علامة (؟) في الدائرة، أو اسحبها إليها.</div>`);
  const complete=()=>parts.lamp&&parts.battery&&parts.wire;
  const put=(chip,slot)=>{ const p=chip.dataset.p;
    if(p===slot&&!parts[slot]){ parts[slot]=true; chip.classList.add("done"); chip.classList.remove("sel"); sel=null; pop(); draw(); if(S.wrong===0) $("#fb").innerHTML=""; }
    else { shakeEl(chip); wrong("هذه القطعة لا توضع هنا."); } };
  const draw=()=>{ $("#cv").innerHTML=circuitSvg({closed,parts,slot:1,sw:complete()&&!closed});
    $("#cs").textContent=!complete()?"الدائرة ناقصة":closed?"الدائرة مغلقة: المصباح يضيء":"اكتملت القطع. أغلق المفتاح الآن.";
    $("#cv").querySelectorAll("[data-slot]").forEach(g=>g.addEventListener("click",()=>{ if(sel) put(sel,g.dataset.slot); }));
    const sw=$("#sw"); sw.addEventListener("click",()=>{ if(closed) return; if(!complete()){ wrong("أكمل القطع الناقصة أولاً."); return; } closed=true; pop(); draw(); correct(q,"الدائرة المغلقة تجعل المصباح يضيء."); }); };
  draw();
  body.querySelectorAll("#tray .chip").forEach(ch=>dragify(ch,()=>{ body.querySelectorAll("#tray .chip").forEach(x=>x.classList.remove("sel")); ch.classList.add("sel"); sel=ch; },
    (x,y)=>{ const el=document.elementFromPoint(x,y); const g=el&&el.closest("[data-slot]"); if(g) put(ch,g.dataset.slot); }));
 }
};

/* ---------- result ---------- */
function showResult(){
  const n=S.list.length,p=S.score/n,st=starsFor(p),id=S.id;
  if(st>B(id)){best[UNIT.key+"-"+id]=st;store.set("sci3-best",best);}
  beep(st>=2); if(st>=2) confetti();
  const msg=st===3?"ممتاز! أنت عالِم صغير":st===2?"أحسنت! أداء جيد جداً":st===1?"جيد، تدرّب مرة أخرى لتربح نجوماً أكثر":"لنراجع الدرس ونحاول من جديد";
  $("#view").innerHTML=`<section class="card result"><span class="tab">${id===99?"تحدّي الوحدة":"الدرس "+ORD[id-1]} · ${S.lesson.name}</span>
    <div class="stars">${starStr(st)}</div><div class="big">${S.score} / ${n}</div><h2>${msg}</h2>
    <p class="sub">تُحسب النقطة للنشاط الذي تُنجزه صحيحاً من المحاولة الأولى.</p>
    <div class="actions"><button class="btn" id="again">العب مرة أخرى</button><button class="btn ghost" id="toMap">الدروس</button></div></section>`;
  $("#again").addEventListener("click",()=>start(id)); $("#toMap").addEventListener("click",showMap); updateTotal();
}

/* ---------- Arabic-Indic digits on screen, as in the book ---------- */
const AD="٠١٢٣٤٥٦٧٨٩";
function arab(node){ const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT); let t; while((t=w.nextNode())){ if(/[0-9]/.test(t.nodeValue)) t.nodeValue=t.nodeValue.replace(/[0-9]/g,d=>AD[d]); } }
new MutationObserver(ms=>ms.forEach(m=>{
  if(m.type==="characterData"){ if(/[0-9]/.test(m.target.nodeValue)) arab(m.target.parentNode); }
  else m.addedNodes.forEach(n=>{ if(n.nodeType===3){ if(/[0-9]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/[0-9]/g,d=>AD[d]); } else if(n.nodeType===1&&n.namespaceURI!=="http://www.w3.org/2000/svg") arab(n); else if(n.nodeType===1) n.querySelectorAll&&n.querySelectorAll("text").forEach(arab); });
})).observe($("#app"),{childList:true,subtree:true,characterData:true});

showHome(); arab($("#app"));
})();
</script>
